 [gcode_macro TEST_PA_HARDWARE]
description: Hardware PA calibration using ADS131M02 and CNCKitchen
gcode:
    # === SETTINGS (Can be overridden when calling the macro) ===
    {% set TEMP = params.TEMP|default(215)|float %}
    {% set START_K = params.START_K|default(0.0)|float %}
    {% set END_K = params.END_K|default(0.1)|float %}
    {% set STEP_K = params.STEP_K|default(0.005)|float %}
    
    {% set CYCLES = params.CYCLES|default(14)|int %}
    {% set SLOW_FEED = params.SLOW_FEED|default(0.8)|float %}
    {% set FAST_FEED = params.FAST_FEED|default(8.0)|float %}
    {% set SLOW_HALF = params.SLOW_HALF_S|default(1.0)|float %}
    {% set FAST_HALF = params.FAST_HALF_S|default(0.25)|float %}
    
    {% set ACCEL = params.ACCEL|default(5000)|float %}
    {% set Z_MARKER = params.Z_MARKER_MM|default(2.0)|float %}
    {% set WOBBLE_X = params.WOBBLE_X_MM|default(0.05)|float %}
    
    # Safe parking coordinates (used to extrude filament into free air)
    {% set X_BASE = 30.0 %}
    {% set Y_BASE = 30.0 %}
    {% set Z_BASE = 50.0 %}

    # === PRECOMPUTED VALUES ===
    # Extrusion volume for each phase
    {% set SLOW_E = SLOW_FEED * SLOW_HALF %}
    {% set FAST_E = FAST_FEED * FAST_HALF %}
    
    # Feedrates for synchronized XYZ + E moves
    # In Klipper, F is based on the XYZ movement only.
    # To maintain the correct timing:
    # F = (travel distance / time) * 60
    {% set SLOW_F_XYZ = (WOBBLE_X / SLOW_HALF) * 60 %}
    {% set FAST_F_XYZ = (WOBBLE_X / FAST_HALF) * 60 %}

    # === STARTUP ===
    SAVE_GCODE_STATE NAME=pa_test_state
    
    G90 ; Absolute positioning for XYZ axes
    G28 ; Home all axes
    G1 X{X_BASE} Y{Y_BASE} Z{Z_BASE} F6000 ; Move to the purge area
    M109 S{TEMP} ; Heat the nozzle and wait
    
    M83 ; Relative extrusion (more convenient for repeated cycles)
    SET_VELOCITY_LIMIT ACCEL={ACCEL} ; High acceleration for the pressure "impact"
    
    # Enable the Python module for high-frequency RAM logging
    START_PA_RECORDING
    
    # Z marker (Sharp Z movement. The analysis script will detect this as T=0)
    G1 Z{Z_BASE + Z_MARKER} F1800
    G4 P100
    G1 Z{Z_BASE} F1800
    G4 P500 ; Wait for stabilization (pre-roll dwell)
    
    # === MAIN K SWEEP LOOP ===
    {% set steps = ((END_K - START_K) / STEP_K)|round|int %}
    {% for i in range(steps + 1) %}
        {% set CURRENT_K = START_K + (i * STEP_K) %}
        
        # Set the current Pressure Advance value
        SET_PRESSURE_ADVANCE ADVANCE={CURRENT_K}
        M118 Testing K = {CURRENT_K}
        
        # Extrusion micro-cycles for the current K value
        {% for c in range(CYCLES) %}
            # Slow phase (pressure buildup) + small X offset
            G1 X{X_BASE + WOBBLE_X} E{SLOW_E} F{SLOW_F_XYZ}
            
            # Fast phase (pressure impulse) + return X move
            G1 X{X_BASE} E{FAST_E} F{FAST_F_XYZ}
        {% endfor %}
        
    {% endfor %}
    
    # Final slow phase to produce a clean ending in the recorded graph
    G1 X{X_BASE + WOBBLE_X} E{SLOW_E} F{SLOW_F_XYZ}

    # === FINISH AND ANALYSIS ===
    STOP_PA_RECORDING TEMP={TEMP} START_K={START_K} END_K={END_K} STEP_K={STEP_K} ACCEL={ACCEL} SLOW_FEED={SLOW_FEED} FAST_FEED={FAST_FEED} SLOW_HALF_S={SLOW_HALF} FAST_HALF_S={FAST_HALF} CYCLES={CYCLES} Z_MARKER_MM={Z_MARKER} WOBBLE_X_MM={WOBBLE_X}
    
    # Turn off the heater and restore the previous G-code state
    M104 S0
    RESTORE_GCODE_STATE NAME=pa_test_state
